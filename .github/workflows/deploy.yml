name: Build and deploy

on:
  push:
    branches: [main, hexo]
  pull_request:
  workflow_dispatch:

# PRs do not queue behind production deploys. Never interrupt a deploy midway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    # Keep browser-rendering dependencies on the validated LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # All browser consumers use the default headless shell. Key on the browser
      # manifest so unrelated dependency updates don't invalidate the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      - name: Install Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: |
          npx playwright install --only-shell chromium
          # Runner images often already have the required libraries. Verify by
          # launching, and install system dependencies only if the probe fails.
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); await browser.close();"; then
            npx playwright install-deps chromium
            node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); await browser.close();"
          fi

      # Content-addressed image caches only; do not restore generated content
      # stores or dist, which could retain deleted posts.
      - name: Cache generated images
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.cache/blog-og
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.nvmrc') }}-

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Browser smoke tests
        run: npm run test:smoke

      # Publish dist/ to the gh-pages branch, which Pages is already configured
      # to serve (the Hexo site deployed the same way). This needs no change in
      # the repository settings; switch to actions/deploy-pages later if the
      # Pages source is ever moved to "GitHub Actions".
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: blog.javazero.top
          force_orphan: true
