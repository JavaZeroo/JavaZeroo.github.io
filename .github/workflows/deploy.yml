name: Build and deploy

on:
  push:
    branches: [main, hexo]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a queued deploy, but never interrupts one midway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mermaid diagrams are rendered to SVG at build time, which needs a real
      # browser. Cache the download; the install step still runs every time so
      # the apt-level system libraries are always present.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Publish dist/ to the gh-pages branch, which Pages is already configured
      # to serve (the Hexo site deployed the same way). This needs no change in
      # the repository settings; switch to actions/deploy-pages later if the
      # Pages source is ever moved to "GitHub Actions".
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: blog.javazero.top
          force_orphan: true
